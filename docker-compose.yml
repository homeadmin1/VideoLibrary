name: tiktok-library

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in Portainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}
      POSTGRES_DB: ${POSTGRES_DB:-videolib}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER in Portainer}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer}@db:5432/${POSTGRES_DB:-videolib}
      VIDEO_ROOT: /data/video-library
      PORT: 4000
    volumes:
      - /media/SSD3/TikTokLibrary/Videos:/data/video-library:ro
    expose:
      - "4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./client
    restart: unless-stopped
    ports:
      - "8092:80"
    depends_on:
      - server

volumes:
  pgdata:
